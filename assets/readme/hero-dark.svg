<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">OPPO AI Pin Course Companion</title>
  <desc id="desc">Course Companion title with a transparent metallic ring matching the OPPO AI Pin motif.</desc>
