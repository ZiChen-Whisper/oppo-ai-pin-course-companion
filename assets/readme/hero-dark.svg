      <stop offset="0" stop-color="#192c3b"/>
      <stop offset=".25" stop-color="#344455"/>
      <stop offset=".58" stop-color="#7b7d98"/>
      <stop offset=".82" stop-color="#b5afbe"/>
      <stop offset="1" stop-color="#d4ccc6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1">
