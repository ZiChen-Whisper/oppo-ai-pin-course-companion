  <text x="118" y="70" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="42" letter-spacing="1" fill="#aeb8c5">OPPO AI Pin</text>
  <text x="24" y="175" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="88" font-weight="600" letter-spacing="-2" fill="#e6edf3">Course Companion</text>
  <path d="M28 227H1172" stroke="#303943"/>

